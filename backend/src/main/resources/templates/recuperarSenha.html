<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="login">
<div class="gradiente">
    <div class="logo">
        <img th:src="@{/images/logotipoBranco.svg}" alt="Zatts">
    </div>
    <div class="slogan">
        <p>Sua energia <br> em suas mãos.</p>
    </div>
</div>
<div class="formulario">

    <a href="/login" class="voltar">
        <span class="material-symbols-outlined">arrow_back</span>
        Voltar para o Login
    </a>

    <div class="boasvindas">
        <h1>Recuperar Senha</h1>
            <h4>Informe seu email para receber instruções</h4>
    </div>

    <form action="" method="post">

        <div class="campo">
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail">
        </div>

        <button class="btnEntrar">
            Enviar instruções
        </button>

    </form>
</div>
</body>
</html>
