
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">

    <title>Recuperar Senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>

<body class="login">

<div class="gradiente">

    <div class="logo">
        <img th:src="@{/images/logotipoBranco.svg}" alt="Zatts">
    </div>

    <div class="slogan">
        <p>Sua energia <br> em suas mãos.</p>
    </div>

</div>

<div class="formulario">

    <a th:href="@{/login}" class="voltar">
        <span class="material-symbols-outlined">arrow_back</span>
        Voltar para o Login
    </a>

    <div class="boasvindas">
        <h1>Recuperar Senha</h1>
        <h4>Informe seu email para receber instruções</h4>
    </div>

    <!-- MENSAGEM DE SUCESSO -->
    <div th:if="${mensagem}"
         class="alert alert-success"
         role="status"
         th:text="${mensagem}">
    </div>

    <!-- MENSAGEM DE ERRO -->
    <div th:if="${erro}"
         class="alert alert-danger"
         role="alert"
         th:text="${erro}">
    </div>

    <form th:action="@{/recuperarSenha}" method="post">

        <input type="hidden"
               th:if="${_csrf != null}"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <div class="campo">
            <label for="email">E-mail</label>

            <input type="email"
                   id="email"
                   name="email"
                   placeholder="Digite seu e-mail"
                   autocomplete="email"
                   required>
        </div>

        <button type="submit" class="btnEntrar">
            Enviar instruções
        </button>

    </form>

</div>

</body>
</html>
