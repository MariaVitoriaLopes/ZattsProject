<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/configuracoes.css}">
    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="configuracoes-container">

    <h1 class="titulo-pagina">Configurações</h1>

    <div class="abas-config">
        <a th:href="@{/configuracoes}" class="aba">Conta</a>
        <a th:href="@{/configuracoes/notificacoes}" class="aba">Notificações</a>
        <a th:href="@{/configuracoes/preferencias}" class="aba">Preferências</a>
        <a href="#" class="aba">Dispositivos</a>
        <a href="#" class="aba">Privacidade e Dados</a>
        <a href="#" class="aba">Ajuda e Suporte</a>
    </div>

    <form class="card-config">

        <div class="coluna-config">
            <h2 class="secao-titulo">Informações pessoais</h2>

            <div class="campo">
                <label for="nomeCompleto">Nome completo</label>
                <div class="campo-input">
                    <input type="text" id="nomeCompleto" name="nomeCompleto" value="emailusuario@gmail.com">
                    <button type="button" aria-label="Editar nome completo">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="campo-input">
                    <input type="email" id="email" name="email" value="emailusuario@gmail.com">
                    <button type="button" aria-label="Editar e-mail">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <div class="campo-input">
                    <input type="tel" id="telefone" name="telefone" value="(00) 00000-0000">
                    <button type="button" aria-label="Editar telefone">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="fusoHorario">Fuso Horário</label>
                <div class="campo-input">
                    <select id="fusoHorario" name="fusoHorario">
                        <option value="UTC-3" selected>UTC-3 (Horário de Brasília)</option>
                        <option value="UTC-4">UTC-4 (Horário do Amazonas)</option>
                        <option value="UTC-5">UTC-5 (Horário do Acre)</option>
                        <option value="UTC-2">UTC-2 (Fernando de Noronha)</option>
                    </select>
                    <span class="material-symbols-outlined seta-select">expand_more</span>
                </div>
            </div>
        </div>

        <div class="coluna-config">
            <h2 class="secao-titulo">Endereço</h2>

            <div class="campo">
                <label for="cep">CEP</label>
                <div class="campo-input largura-30">
                    <input type="text" id="cep" name="cep" value="00000-000">
                    <button type="button" aria-label="Editar CEP">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="logradouro">Logradouro <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-66">
                    <input type="text" id="logradouro" name="logradouro" value="Rua X">
                    <button type="button" aria-label="Editar logradouro">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="numero">Número <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-23">
                    <input type="text" id="numero" name="numero" value="01">
                    <button type="button" aria-label="Editar número">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="complemento">Complemento <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-27">
                    <input type="text" id="complemento" name="complemento" value="01">
                    <button type="button" aria-label="Editar complemento">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="bairro">Bairro <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-43">
                    <input type="text" id="bairro" name="bairro" value="Rua X">
                    <button type="button" aria-label="Editar bairro">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="cidade">Cidade <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-45">
                    <input type="text" id="cidade" name="cidade" value="Rua X">
                    <button type="button" aria-label="Editar cidade">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="uf">UF <span class="obrigatorio">*</span></label>
                <div class="campo-input largura-25">
                    <input type="text" id="uf" name="uf" value="Rua X">
                    <button type="button" aria-label="Editar UF">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="coluna-config">
            <h2 class="secao-titulo">Gerenciar minha conta</h2>

            <div class="campo">
                <label for="senha">Senha</label>
                <div class="campo-input largura-80">
                    <input type="password" id="senha" name="senha" value="1234567890">
                    <button type="button" aria-label="Editar senha">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="campo">
                <label for="confirmarSenha">
                    Confirmação de senha
                    <small class="dica-campo">Senha coincide com atual</small>
                </label>
                <div class="campo-input largura-80">
                    <input type="password" id="confirmarSenha" name="confirmarSenha" value="1234567890">
                    <button type="button" aria-label="Editar confirmação de senha">
                        <span class="material-symbols-outlined">edit</span>
                    </button>
                </div>
            </div>

            <div class="acoes-conta">
                <button type="button" class="btn-config btn-sair">Sair desta sessão</button>

                <button type="button" class="btn-config btn-excluir">
                    <span class="material-symbols-outlined">delete</span>
                    Deletar minha conta
                </button>

                <p class="aviso">Ao deletar sua conta você concorda em perder todos os seus dados.</p>
            </div>
        </div>

    </form>

</main>

</body>

</html>
