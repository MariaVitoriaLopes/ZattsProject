
<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Configurações</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/configuracoes.css}">
    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="configuracoes-container">

    <h1 class="titulo-pagina">Configurações</h1>

    <div class="abas-config">
        <a th:href="@{/configuracoes}" class="aba">Conta</a>
        <a th:href="@{/configuracoes/notificacoes}" class="aba">Notificações</a>
        <a th:href="@{/configuracoes/preferencias}" class="aba">Preferências</a>
        <a th:href="@{/configuracoes/dispositivos}" class="aba">Dispositivos</a>
        <a th:href="@{/configuracoes/privacidade}" class="aba">Privacidade e Dados</a>
        <a th:href="@{/configuracoes/ajuda}" class="aba">Ajuda e Suporte</a>
    </div>

    <div th:if="${mensagem}" class="mensagem-sucesso" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="mensagem-erro" th:text="${erro}"></div>

    <form class="card-config"
          id="formConfiguracoes"
          th:action="@{/configuracoes/editar-completo}"
          method="post">

        <!-- CONTROLES GERAIS -->
        <div class="acoes-edicao">
            <button type="button"
                    id="btnEditarTudo"
                    class="btn-editar-tudo">
                <span class="material-symbols-outlined">edit</span>
                Editar informações
            </button>

            <div id="botoesEdicao" hidden>
                <button type="submit"
                        id="btnSalvarTudo"
                        class="btn-salvar-tudo">
                    Salvar alterações
                </button>

                <button type="button"
                        id="btnCancelarTudo"
                        class="btn-cancelar-tudo">
                    Cancelar
                </button>
            </div>
        </div>

        <!-- INFORMAÇÕES PESSOAIS -->
        <div class="coluna-config">

            <h2 class="secao-titulo">Informações pessoais</h2>

            <div class="campo">
                <label for="nomeCompleto">Nome completo</label>
                <div class="campo-input">
                    <input type="text"
                           id="nomeCompleto"
                           name="nome"
                           th:value="${usuario.nome}"
                           placeholder="Ex.: Maria Silva"
                           required
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <div class="campo-input">
                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${usuario.email}"
                           placeholder="Ex.: maria@gmail.com"
                           required
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <div class="campo-input">
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           th:value="${usuario.telefone}"
                           placeholder="Ex.: (13) 99999-9999"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="fusoHorario">Fuso Horário</label>
                <div class="campo-input">

                    <select id="fusoHorario"
                            name="fusoHorario"
                            disabled>

                        <option value="UTC-3"
                                th:selected="${configuracao != null and configuracao.fusoHorario == 'UTC-3'}">
                            UTC-3 (Horário de Brasília)
                        </option>

                        <option value="UTC-4"
                                th:selected="${configuracao != null and configuracao.fusoHorario == 'UTC-4'}">
                            UTC-4 (Horário do Amazonas)
                        </option>

                        <option value="UTC-5"
                                th:selected="${configuracao != null and configuracao.fusoHorario == 'UTC-5'}">
                            UTC-5 (Horário do Acre)
                        </option>

                        <option value="UTC-2"
                                th:selected="${configuracao != null and configuracao.fusoHorario == 'UTC-2'}">
                            UTC-2 (Fernando de Noronha)
                        </option>

                    </select>

                    <span class="material-symbols-outlined seta-select">expand_more</span>
                </div>
            </div>

        </div>

        <!-- ENDEREÇO -->
        <div class="coluna-config">

            <h2 class="secao-titulo">Endereço</h2>

            <div class="campo">
                <label for="cep">CEP</label>
                <div class="campo-input largura-30">
                    <input type="text"
                           id="cep"
                           name="cep"
                           th:value="${configuracao != null ? configuracao.cep : ''}"
                           placeholder="Ex.: 11000-000"
                           maxlength="9"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="logradouro">Logradouro</label>
                <div class="campo-input largura-66">
                    <input type="text"
                           id="logradouro"
                           name="logradouro"
                           th:value="${configuracao != null ? configuracao.logradouro : ''}"
                           placeholder="Ex.: Rua das Flores"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="numero">Número</label>
                <div class="campo-input largura-23">
                    <input type="text"
                           id="numero"
                           name="numero"
                           th:value="${configuracao != null ? configuracao.numero : ''}"
                           placeholder="Ex.: 123"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="complemento">Complemento</label>
                <div class="campo-input largura-27">
                    <input type="text"
                           id="complemento"
                           name="complemento"
                           th:value="${configuracao != null ? configuracao.complemento : ''}"
                           placeholder="Ex.: Apartamento 10"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="bairro">Bairro</label>
                <div class="campo-input largura-43">
                    <input type="text"
                           id="bairro"
                           name="bairro"
                           th:value="${configuracao != null ? configuracao.bairro : ''}"
                           placeholder="Ex.: Centro"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="cidade">Cidade</label>
                <div class="campo-input largura-45">
                    <input type="text"
                           id="cidade"
                           name="cidade"
                           th:value="${configuracao != null ? configuracao.cidade : ''}"
                           placeholder="Ex.: Santos"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="uf">UF</label>
                <div class="campo-input largura-25">
                    <input type="text"
                           id="uf"
                           name="uf"
                           maxlength="2"
                           th:value="${configuracao != null ? configuracao.uf : ''}"
                           placeholder="Ex.: SP"
                           readonly>
                </div>
            </div>

        </div>

        <!-- GERENCIAR CONTA -->
        <div class="coluna-config">

            <h2 class="secao-titulo">Gerenciar minha conta</h2>

            <div class="campo">
                <label for="senha">Nova senha</label>
                <div class="campo-input largura-80">
                    <input type="password"
                           id="senha"
                           name="senha"
                           placeholder="Digite sua nova senha"
                           autocomplete="new-password"
                           readonly>
                </div>
            </div>

            <div class="campo">
                <label for="confirmarSenha">Confirmação de senha</label>
                <div class="campo-input largura-80">
                    <input type="password"
                           id="confirmarSenha"
                           name="confirmarSenha"
                           placeholder="Confirme sua nova senha"
                           autocomplete="new-password"
                           readonly>
                </div>
            </div>

            <div class="acoes-conta">

                <button type="button"
                        class="btn-config btn-sair">
                    Sair desta sessão
                </button>

                <button type="button"
                        class="btn-config btn-excluir">
                    <span class="material-symbols-outlined">delete</span>
                    Deletar minha conta
                </button>

                <p class="aviso">
                    Ao deletar sua conta você concorda em perder todos os seus dados.
                </p>

            </div>

        </div>

    </form>

</main>

<script th:src="@{/js/configuracoes.js}"></script>

</body>
</html>
