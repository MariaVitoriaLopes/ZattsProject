<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="login">
    <div class="gradiente">
        <img th:src="@{/images/logotipo.svg}" alt="">
        <p>Sua energia em suas mãos.</p>
    </div>
    <div class="formulario">

        <a class="voltar">
            <span class="material-symbols-outlined">arrow_back</span>
            Voltar para Página Institucional
        </a>

        <div class="boasvindas">
            <h1>Bem-vindo ao Zatts</h1>
            <h4>Acesse sua conta</h4>
        </div>


        <form action="" method="post">

            <div class="campo">
                <label>E-mail</label>
                <input
                        type="email"
                        placeholder="Digite seu e-mail">
            </div>


            <div class="campo senha">
                <label>Senha</label>

                    <input
                            type="password"
                            placeholder="Digite sua senha">

            </div>


            <a class="esqueci">
                Esqueci minha senha
            </a>


            <button class="btnEntrar">
                Entrar
            </button>


            <p class="cadastro">
                Ainda não tem cadastro?
                <a href="/cadastro">
                    Cadastrar-se agora!
                </a>
            </p>


        </form>

    </div>
</body>
</html>
