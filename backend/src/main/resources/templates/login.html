<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="login">
    <div class="gradiente">
        <img th:src="@{/images/logotipoBranco.svg}" alt="Zatts">
        <div class="slogan">
            <p>Sua energia <br> em suas mãos.</p>
        </div>
    </div>
    <div class="formulario">

        <a href="/" class="voltar">
            <span class="material-symbols-outlined">arrow_back</span>
            Voltar para Página Institucional
        </a>

        <div class="boasvindas">
            <h1>Bem-vindo ao Zatts</h1>
            <h4>Acesse sua conta</h4>
            <div th:if="${erro}" class="alert alert-danger">
                <span th:text="${erro}"></span>
            </div>


            <div th:if="${sucesso}" class="alert alert-success">
                <span th:text="${sucesso}"></span>
            </div>
        </div>


        <form action="/login" method="post">

            <div class="campo">
                <label>E-mail</label>
                <input
                        type="email"
                        name="email"
                        placeholder="Digite seu e-mail">
            </div>


            <div class="campo senha">
                <label>Senha</label>

                <div class="inputSenhaPassword">
                    <input
                            type="password"
                            id="senhaLogin"
                            name="senha"
                            placeholder="Digite sua senha">
                    <span class="material-symbols-outlined visibility" onclick="mostrarSenha('senhaLogin', this)">visibility</span>
                    <span class="material-symbols-outlined visibility_off" onclick="mostrarSenha('senhaLogin', this)">visibility_off</span>
                </div>

            </div>


            <a href="/recuperarSenha" class="esqueci">
                Esqueci minha senha
            </a>


            <button class="btnEntrar" type="submit">
                Entrar
            </button>


            <p class="cadastro">
                Ainda não tem cadastro?
                <a href="/cadastro">
                    Cadastrar-se agora!
                </a>
            </p>


        </form>

    </div>

    <script th:src="@{/js/script.js}"></script>
</body>
</html>
