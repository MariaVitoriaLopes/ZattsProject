<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<section th:fragment="valor"
         class="dashboard-card">

    <div class="card-header-dashboard">

        <div>

            <h2>
                Estimativa da conta de energia
            </h2>

            <p>
                Comparativo dos últimos meses
            </p>

        </div>

    </div>

    <div class="grafico conta">

        <canvas id="chartValorConta"></canvas>
        <div class="chart-legenda">
            <span class="badge-dashboard">
                    <span></span>
                    Quadro 1
            </span>

            <div class="legenda-grafico">
                <span class="material-symbols-outlined">info</span>
                Os valores monetários são estimativas baseada na tarifa configurada.
            </div>
        </div>
    </div>

</section>

</html>
