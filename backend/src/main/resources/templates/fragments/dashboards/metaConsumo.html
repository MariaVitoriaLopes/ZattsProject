<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<section th:fragment="meta"
         class="dashboard-card card-meta-consumo">

    <div class="card-header-dashboard">

        <div>
            <h2>Meta de consumo mensal</h2>
            <p>Acompanhe sua meta para economizar</p>
        </div>

        <button class="btn-editar-meta"
                type="button"
                aria-label="Editar meta">

            <span class="material-symbols-outlined">edit</span>

        </button>

    </div>

    <div class="barra-meta">

        <div class="progresso-meta"
             id="progressoMeta"
             th:style="'width: ' + (${dash != null ? (dash.percentualMetaAtingida > 100 ? 100 : dash.percentualMetaAtingida) : 0}) + '%'">
        </div>

    </div>

    <div class="meta-info">

        <span id="consumoAtualTexto"
              th:text="${dash != null ? dash.consumoTotalDiarioKwh + ' kWh' : '0 kWh'}">
            0 kWh
        </span>

        <span id="limiteMeta"
              th:text="${dash != null ? 'Meta: ' + dash.metaGastoKwh + ' kWh' : 'Meta não definida'}">
            Meta não definida
        </span>

    </div>

    <div class="legenda-meta">

        <div>

            <span class="bolinha-verde"></span>

            Consumo atual:

            <strong id="consumoMensal"
                    th:text="${dash != null ? dash.metaConsumoMensalAtualKwh + ' kWh' : '-- kWh'}">
                -- kWh
            </strong>

        </div>

        <div>

            <span class="bolinha-cinza"></span>

            Meta:

            <strong id="valorMeta"
                    th:text="${dash != null ? dash.metaGastoKwh + ' kWh' : '-- kWh'}">
                -- kWh
            </strong>

        </div>

    </div>

</section>

</html>
