<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<section th:fragment="consumo"
         class="dashboard-card card-consumo-atual">

    <div class="card-header-dashboard">

        <div>
            <h2>Consumo de energia atual</h2>
            <p>Veja o consumo de energia em tempo real</p>
        </div>

        <span class="badge-dashboard">
            <span></span>
            Quadro 1
        </span>

    </div>

    <div class="grafico grafico-atual">
        <canvas id="chartConsumoRealtime"></canvas>
    </div>

    <p class="estado-grafico" id="estadoConsumoRealtime">
        Aguardando medições do dispositivo...
    </p>

</section>

</html>
