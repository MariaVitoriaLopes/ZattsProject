
<!-- =====================================================
     MODAL DE META
===================================================== -->

<div th:fragment="modalMeta"
     id="modalMeta"
     class="modal-meta"
     role="dialog"
     aria-modal="true"
     aria-labelledby="tituloModalMeta"
     hidden>

    <div class="modal-meta-conteudo">

        <div class="modal-meta-cabecalho">

            <h2 id="tituloModalMeta">Editar meta</h2>

            <button type="button"
                    id="btnFecharModalMeta"
                    class="modal-meta-fechar"
                    aria-label="Fechar">
                <span class="material-symbols-outlined">close</span>
            </button>

        </div>

        <form id="formMeta"
              method="post"
              th:attr="data-url-criar=@{/metas/criar},
                       data-url-editar=@{/metas/editar}">

            <div class="modal-meta-campo">

                <label for="tipoMetaFormulario">Tipo de meta</label>

                <select id="tipoMetaFormulario"
                        name="tipo"
                        required>

                    <option value="">Selecione o tipo</option>

                    <option value="CONSUMO"
                            data-disponivel="true">
                        Consumo de energia (kWh)
                    </option>

                    <option value="VALOR"
                            data-disponivel="false">
                        Gastos de energia (R$)
                    </option>

                </select>

            </div>

            <div class="modal-meta-campo">

                <label id="labelValorMeta"
                       for="valorMetaFormulario">
                    Meta mensal de consumo (kWh)
                </label>

                <input type="number"
                       id="valorMetaFormulario"
                       name="valor"
                       min="0.01"
                       step="0.01"
                       placeholder="Ex.: 250"
                       required>

            </div>

            <div class="modal-meta-acoes">

                <button type="button"
                        id="btnCancelarMeta"
                        class="btn-cancelar-meta">
                    Cancelar
                </button>

                <button type="submit"
                        id="btnSalvarMeta"
                        class="btn-salvar-meta">

                    <span class="material-symbols-outlined">check</span>
                    <span>Salvar alterações</span>

                </button>

            </div>

        </form>

    </div>

</div>
