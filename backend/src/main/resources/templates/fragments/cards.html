<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<div th:fragment="cardsResumo" class="cards-resumo">

    <!-- CARD 1: CONSUMO TOTAL DIÁRIO -->
    <div class="card-dashboard">

        <div class="icone-card">
            <span class="material-symbols-outlined">bolt</span>
        </div>

        <div>
            <span>Consumo Total Diário</span>

            <h2>
                <span id="cardConsumoTotalDiario"
                      th:text="${dash != null ? #numbers.formatDecimal(dash.consumoTotalDiarioKwh, 1, 'POINT', 1, 'COMMA') : '0.0'}">32.8</span>
                <small>kWh</small>
            </h2>

            <p class="vermelho" id="cardVariacaoDiaria"
               th:text="${dash != null && dash.variacaoDiariaPorcentagem != null ? '↗ ' + dash.variacaoDiariaPorcentagem + '% a mais que ontem' : '↗ 8% a mais que ontem'}">
                ↗ 8% a mais que ontem
            </p>

        </div>

    </div>

    <!-- CARD 2: CUSTO DIÁRIO -->
    <div class="card-dashboard">

        <div class="icone-card">
            <span class="material-symbols-outlined">paid</span>
        </div>

        <div>

            <span>Custo Diário</span>

            <h2>
                <span id="cardCustoDiario"
                      th:text="${dash != null ? #numbers.formatDecimal(dash.custoDiarioReais, 1, 'POINT', 2, 'COMMA') : '0,00'}">3,57</span>
                <small>Reais</small>
            </h2>

            <p id="cardStatusCusto"
               th:text="${dash != null && dash.statusCustoDiario != null ? '→ ' + dash.statusCustoDiario : '→ Valor estimado normal'}">
                → Valor estimado normal
            </p>

        </div>

    </div>

    <!-- CARD 3: META DE GASTO -->
    <div class="card-dashboard">

        <div class="icone-card">
            <span class="material-symbols-outlined">flag</span>
        </div>

        <div>

            <span>Meta de Gasto</span>

            <h2>
                <span id="cardMetaGasto"
                      th:text="${dash != null ? #numbers.formatDecimal(dash.metaGastoKwh, 1, 'POINT', 0, 'COMMA') : '250'}">260</span>
                <small>kWh</small>
            </h2>

            <p class="amarelo" id="cardPercentualMeta"
               th:text="${dash != null ? '↗ ' + #numbers.formatDecimal(dash.percentualMetaAtingida, 1, 'POINT', 0, 'COMMA') + '% da meta atingida' : '↗ 64% da meta atingida'}">
                ↗ 64% da meta atingida
            </p>

        </div>

    </div>

    <!-- CARD 4: ESTIMATIVA DA CONTA DE LUZ / ECONOMIA -->
    <div class="card-dashboard">

        <div class="icone-card">
            <span class="material-symbols-outlined">savings</span>
        </div>

        <div>

            <span>Estimativa de Conta</span>

            <h2>
                <span id="cardValorContaEstimado"
                      th:text="${dash != null ? #numbers.formatDecimal(dash.valorContaEstimadoMesReais, 1, 'POINT', 2, 'COMMA') : '0,00'}">3,45</span>
                <small>Reais</small>
            </h2>

            <p class="verde" id="cardStatusEstimativa"
               th:text="${dash != null && dash.statusEstimativaConta != null ? '↘ ' + dash.statusEstimativaConta : '↘ 10% em relação ao mês anterior'}">
                ↘ 10% em relação ao mês anterior
            </p>

        </div>

    </div>

</div>

</html>
