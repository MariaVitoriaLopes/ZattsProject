<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Home</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/dashboards.css}">

    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="container-dashboard">

    <!-- CABEÇALHO -->
    <section class="titulo-dashboard">
        <div>
            <h1>Dashboard</h1>
            <p>
                Acompanhe o consumo elétrico da sua residência
                de forma simples, inteligente e acessível.
            </p>
        </div>

        <div class="cardMeta status-sem-meta" id="cardStatusMeta">
            <span class="material-symbols-outlined bandeiraMeta" id="iconeStatusMeta">
                flag
            </span>

            <div class="textoMeta">
                <h2 id="textoStatusMeta">
                    Carregando a sua meta...
                </h2>

                <p id="descricaoStatusMeta">
                    Acompanhamento do consumo mensal
                </p>
            </div>
        </div>
    </section>

    <!-- CARDS DE RESUMO EXISTENTES -->
    <div th:replace="~{fragments/cards :: cardsResumo}"></div>

    <!-- GRÁFICOS -->
    <section class="dashboard-grid">

        <!-- CONSUMO EM TEMPO REAL (MINUTO A MINUTO) -->
        <div th:replace="~{fragments/dashboards/consumo :: consumo}"></div>

        <!-- CONSUMO DIÁRIO E META -->
        <div class="coluna-central">
            <div th:replace="~{fragments/dashboards/comparativo :: comparativo}"></div>
            <div th:replace="~{fragments/dashboards/metaConsumo :: meta}"></div>
        </div>

        <!-- VALOR DA CONTA (ESTIMATIVA) -->
        <div th:replace="~{fragments/dashboards/valorConta :: valor}"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script th:src="@{/js/script.js}"></script>

<!-- INTEGRAÇÃO COM BACKEND ZATTS (ESTRUTURA EXATA DO FIGMA + SSE) -->
<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const initialDash = /*[[${dash}]]*/ null;

        let chartRealtime = null;
        let chartComparativo = null;
        let chartValorConta = null;

        const TARIFA_KWH = 0.85;
        const CIP_FIXA = 12.50;

        // 1. ATUALIZA TEXTOS, CARDS DA UI E COMPONENTES DE META
        function atualizarInterface(dash) {
            if (!dash) return;

            // Status da Meta no Topo
            const textoStatusMeta = document.getElementById("textoStatusMeta");
            if (textoStatusMeta && dash.mensagemStatusMeta) {
                textoStatusMeta.innerText = dash.mensagemStatusMeta;
            }

            // Componentes do Quadro "Meta de Consumo Mensal"
            const progressoMeta = document.getElementById("progressoMeta");
            const consumoAtualTexto = document.getElementById("consumoAtualTexto");
            const consumoMensal = document.getElementById("consumoMensal");
            const limiteMeta = document.getElementById("limiteMeta");
            const valorMeta = document.getElementById("valorMeta");

            // Consumo ACUMULADO DO MÊS
            const acumuladoMes = dash.metaConsumoMensalAtualKwh !== undefined ? dash.metaConsumoMensalAtualKwh : (dash.consumoTotalDiarioKwh || 0);
            const limite = dash.metaGastoKwh || dash.metaConsumoMensalLimiteKwh || 250;

            if (progressoMeta) {
                const perc = limite > 0 ? (acumuladoMes / limite) * 100 : 0;
                progressoMeta.style.width = (perc > 100 ? 100 : perc) + "%";
            }

            if (consumoAtualTexto) consumoAtualTexto.innerText = acumuladoMes.toFixed(2) + " kWh";
            if (consumoMensal) consumoMensal.innerText = acumuladoMes.toFixed(2) + " kWh";
            if (limiteMeta) limiteMeta.innerText = "Meta: " + limite + " kWh";
            if (valorMeta) valorMeta.innerText = limite + " kWh";

            // CARDS SUPERIORES DE RESUMO
            const elConsumo = document.getElementById("cardConsumoTotalDiario"); // Card 1
            const elCusto = document.getElementById("cardCustoDiario");           // Card 2
            const elMeta = document.getElementById("cardMetaGasto");             // Card 3
            const elPercentual = document.getElementById("cardPercentualMeta");
            const elConta = document.getElementById("cardValorContaEstimado");   // Card 4

            // Card 1: Consumo Total Diário em kWh (2 casas decimais)
            const consumoDiarioKwh = dash.consumoTotalDiarioKwh || 0;
            if (elConsumo) {
                elConsumo.innerText = consumoDiarioKwh.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Card 2: Custo Diário em Reais (R$)
            const custoDiario = consumoDiarioKwh * TARIFA_KWH;
            if (elCusto) {
                elCusto.innerText = custoDiario.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            // Card 3: Meta de Gasto em kWh
            if (elMeta && dash.metaGastoKwh !== undefined) {
                elMeta.innerText = Math.round(dash.metaGastoKwh);
            }

            if (elPercentual && dash.percentualMetaAtingida !== undefined) {
                elPercentual.innerText = "↗ " + Math.round(dash.percentualMetaAtingida) + "% da meta atingida";
            }

            // Card 4: Estimativa da Conta de Luz em Reais (Dinâmica)
            const estimativaConta = (acumuladoMes * TARIFA_KWH) + CIP_FIXA;
            if (elConta) {
                elConta.innerText = estimativaConta.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
        }

        // 2. GRÁFICO 1 (ESQUERDA): CONSUMO ATUAL (MINUTO A MINUTO - PADRÃO FIGMA)
        function initChartRealtime(dash) {
            const cores = coresGrafico();
            const canvas = document.getElementById("chartConsumoRealtime");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const listaMinutos = (dash && dash.consumoTempoReal) ? dash.consumoTempoReal : [];

            chartRealtime = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: listaMinutos.map(p => p.hora || p.horario || p.instante),
                    datasets: [{
                        label: 'Consumo (kWh)',
                        data: listaMinutos.map(p => p.consumoKwh),
                        borderColor: cores.linha,
                        backgroundColor: cores.preenchimento,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        pointBackgroundColor: cores.linha
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grace: '15%', grid: { color: 'rgba(255,255,255,0.08)' } },
                        x: { grid: { display: false }, ticks: {maxTicksLimit: 10} }
                    }
                }
            });
        }

        function initChartComparativo(dash) {
            const cores = coresGrafico();
            const canvas = document.getElementById("chartResumoComparativo");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const listaHoras = (dash && dash.consumoDiarioHoras) ? dash.consumoDiarioHoras : [];

            // Filtra barras vazias mantendo apenas horas ativas
            const horasFiltradas = listaHoras.filter(p => (p.consumoKwh && p.consumoKwh > 0) || (p.valor && p.valor > 0));
            const dadosExibicao = horasFiltradas.length > 0 ? horasFiltradas : listaHoras;

            chartComparativo = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: dadosExibicao.length > 0
                        ? dadosExibicao.map(p => p.hora || (p.horaInt !== undefined ? p.horaInt + 'h' : ''))
                        : ['2h','12h','13h'],
                    datasets: [{
                        label: 'Consumo (kWh)',
                        data: dadosExibicao.map(p => p.consumoKwh || p.valor || 0),
                        backgroundColor: cores.linha,
                        borderRadius: 4,
                        maxBarThickness: 36
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) { return context.raw + ' kWh'; }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grace: '15%',
                            grid: {
                                color: 'rgba(255,255,255,0.08)'
                            },
                            ticks: {
                                maxTicksLimit: 6
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                autoSkip: true,
                                maxTicksLimit: 6
                            }
                        }
                    }
                }
            });
        }

        function initChartValorConta(dash) {
            const cores = coresGrafico();
            const canvas = document.getElementById("chartValorConta");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const listaMeses = (dash && dash.valorContaEstimadoReais) ? dash.valorContaEstimadoReais : [];

            chartValorConta = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: listaMeses.map(p => p.mes),
                    datasets: [{
                        label: 'Valor Estimado (R$)',
                        data: listaMeses.map(p => p.valor),
                        backgroundColor: cores.linha,
                        borderRadius: 4,
                        maxBarThickness: 36
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            min: 0,
                            max: 300,
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: {
                                stepSize: 50,
                                callback: v => v === 0 ? '0' : 'R$ ' + v
                            }
                        },
                        x: { grid: { display: false }, ticks: {autoSkip: true, maxTicksLimit: 3} }
                    }
                }
            });
        }

        function coresGrafico() {
            const raiz = document.documentElement;
            const estilos = getComputedStyle(raiz);

            const escuro = raiz.getAttribute('data-tema') === 'escuro';

            const primaria = estilos.getPropertyValue('--cor-primaria-400').trim() || '#E6FB1A';

            // Cria a cor com transparência para o gráfico de linha
            const corTemporaria = document.createElement('span');
            corTemporaria.style.color = primaria;
            document.body.appendChild(corTemporaria);

            const corRGB = getComputedStyle(corTemporaria).color;
            corTemporaria.remove();

            const preenchimento = corRGB.replace(
                /^rgb\((.+)\)$/,
                'rgba($1, 0.25)'
            );

            return {
                linha: primaria,
                preenchimento: preenchimento,
                texto: escuro ? '#FFFFFF' : '#434343',
                grade: escuro
                    ? 'rgba(255, 255, 255, 0.08)'
                    : 'rgba(0, 0, 0, 0.08)'
            };
        }

        // Carga Inicial
        if (initialDash) {
            atualizarInterface(initialDash);
            initChartRealtime(initialDash);
            initChartComparativo(initialDash);
            initChartValorConta(initialDash);
        }

        if (window.EventSource) {
            const eventSource = new EventSource('/api/v1/web/dashboard/sse');

            eventSource.addEventListener('nova-leitura', function (event) {
                fetch('/api/v1/web/dashboard/dados')
                    .then(res => res.json())
                    .then(dash => {
                        atualizarInterface(dash);

                        if (chartRealtime && dash.consumoTempoReal) {
                            chartRealtime.data.labels = dash.consumoTempoReal.map(p => p.hora || p.horario || p.instante);
                            chartRealtime.data.datasets[0].data = dash.consumoTempoReal.map(p => p.consumoKwh);
                            chartRealtime.update();
                        }

                        // Atualiza o Gráfico 2
                        if (chartComparativo && dash.consumoDiarioHoras) {
                            const horasFiltradas = dash.consumoDiarioHoras.filter(p => (p.consumoKwh && p.consumoKwh > 0) || (p.valor && p.valor > 0));
                            const dadosExibicao = horasFiltradas.length > 0 ? horasFiltradas : dash.consumoDiarioHoras;

                            chartComparativo.data.labels = dadosExibicao.map(p => p.hora || (p.horaInt !== undefined ? p.horaInt + 'h' : ''));
                            chartComparativo.data.datasets[0].data = dadosExibicao.map(p => p.consumoKwh || p.valor || 0);
                            chartComparativo.update();
                        }

                        // Atualiza o Gráfico 3
                        if (chartValorConta && dash.valorContaEstimadoReais) {
                            chartValorConta.data.labels = dash.valorContaEstimadoReais.map(p => p.mes);
                            chartValorConta.data.datasets[0].data = dash.valorContaEstimadoReais.map(p => p.valor);
                            chartValorConta.update();
                        }
                    })
                    .catch(err => console.error("Erro ao sincronizar SSE:", err));
            });
        }


        function atualizarCoresGraficos() {
            const cores = coresGrafico();

            [chartRealtime, chartComparativo, chartValorConta].forEach(chart => {
                if (!chart) return;

                chart.data.datasets.forEach(dataset => {
                    dataset.backgroundColor = chart.config.type === 'line'
                        ? cores.preenchimento
                        : cores.linha;

                    if (chart.config.type === 'line') {
                        dataset.borderColor = cores.linha;
                        dataset.pointBackgroundColor = cores.linha;
                    }
                });

                chart.options.scales.y.grid.color = cores.grade;
                chart.options.scales.y.ticks.color = cores.texto;
                chart.options.scales.x.ticks.color = cores.texto;

                chart.update('none');
            });
        }

        document.addEventListener('zatts:tema', atualizarCoresGraficos);
    });
</script>

</body>
</html>
