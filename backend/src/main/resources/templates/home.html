
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Home</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/dashboards.css}">

    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="container-dashboard">

    <!-- CABEÇALHO -->

    <section class="titulo-dashboard">

        <div>
            <h1>Dashboard</h1>
            <p>
                Acompanhe o consumo elétrico da sua residência
                de forma simples, inteligente e acessível.
            </p>
        </div>

        <div class="cardMeta status-sem-meta" id="cardStatusMeta">

            <span class="material-symbols-outlined bandeiraMeta"
                  id="iconeStatusMeta">
                flag
            </span>

            <div class="textoMeta">

                <h2 id="textoStatusMeta">
                    Carregando a sua meta...
                </h2>

                <p id="descricaoStatusMeta">
                    Acompanhamento do consumo mensal
                </p>

            </div>

        </div>

    </section>

    <!-- CARDS DE RESUMO EXISTENTES -->

    <div th:replace="~{fragments/cards :: cardsResumo}"></div>

    <!-- GRÁFICOS -->

    <section class="dashboard-grid">

        <!-- CONSUMO EM TEMPO REAL -->

        <div th:replace="~{fragments/dashboards/consumo :: consumo}"></div>

        <!-- CONSUMO DIÁRIO E META -->

        <div class="coluna-central">

            <div th:replace="~{fragments/dashboards/comparativo :: comparativo}"></div>

            <div th:replace="~{fragments/dashboards/metaConsumo :: meta}"></div>

        </div>

        <!-- VALOR DA CONTA -->

        <div th:replace="~{fragments/dashboards/valorConta :: valor}"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>
</html>
