
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Home</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/dashboards.css}">
    <link rel="stylesheet" th:href="@{/css/modais.css}">

    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="container-dashboard">

    <section class="titulo-dashboard">
        <div>
            <h1>Dashboard</h1>
            <p>
                Acompanhe o consumo elétrico da sua residência
                de forma simples, inteligente e acessível.
            </p>
        </div>

        <div class="cardMeta status-sem-meta" id="cardStatusMeta">
            <span class="material-symbols-outlined bandeiraMeta" id="iconeStatusMeta">flag</span>
            <div class="textoMeta">
                <h2 id="textoStatusMeta">Carregando a sua meta...</h2>
                <p id="descricaoStatusMeta">Acompanhamento do consumo mensal</p>
            </div>
        </div>
    </section>

    <div th:replace="~{fragments/cards :: cardsResumo}"></div>

    <section class="dashboard-grid">

        <div th:replace="~{fragments/dashboards/consumo :: consumo}"></div>

        <div class="coluna-central">
            <div th:replace="~{fragments/dashboards/comparativo :: comparativo}"></div>
            <div th:replace="~{fragments/dashboards/metaConsumo :: meta}"></div>
        </div>

        <div th:replace="~{fragments/dashboards/valorConta :: valor}"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script th:src="@{/js/script.js}"></script>
<script th:src="@{/js/metas.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/

    document.addEventListener("DOMContentLoaded", () => {

        const initialDash = /*[[${dash}]]*/ null;

        const ENDPOINT_DADOS = /*[[@{/api/v1/web/dashboard/dados}]]*/ "/api/v1/web/dashboard/dados";

        const INTERVALO_ATUALIZACAO = 5000;
        const AJUSTE_VISUAL_KWH = 0.005;

        let chartRealtime = null;
        let chartComparativo = null;
        let chartValorConta = null;

        let requisicaoEmAndamento = false;

        const numero = valor => {
            const convertido = Number(valor);
            return Number.isFinite(convertido) ? convertido : 0;
        };

        const formatarNumero = valor => numero(valor).toLocaleString("pt-BR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

        const formatarKwh = valor => formatarNumero(valor) + " kWh";

        const formatarReais = valor => numero(valor).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

        // =====================================================
        // CORES DO TEMA
        // =====================================================

        function obterCoresTema() {

            const raiz = document.documentElement;
            const estilos = getComputedStyle(raiz);

            const escuro = raiz.getAttribute("data-tema") === "escuro";

            const primaria =
                estilos.getPropertyValue("--cor-primaria-400").trim() ||
                estilos.getPropertyValue("--cor-destaque").trim() ||
                "#C2F012";

            const temporario = document.createElement("span");
            temporario.style.color = primaria;

            document.body.appendChild(temporario);

            const corRgb = getComputedStyle(temporario).color;

            temporario.remove();

            return {
                linha: primaria,
                preenchimento: corRgb.replace(/^rgb\((.+)\)$/, "rgba($1, 0.22)"),
                texto: escuro ? "#D1D5DB" : "#6B7280",
                grade: escuro ? "rgba(255,255,255,0.10)" : "rgba(0,0,0,0.08)",
                tooltip: escuro ? "#262626" : "#1E293B"
            };
        }

        function opcoesComuns(cores) {

            return {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,

                plugins: {
                    legend: {
                        display: false
                    },

                    tooltip: {
                        backgroundColor: cores.tooltip,
                        titleColor: "#FFFFFF",
                        bodyColor: "#FFFFFF"
                    }
                }
            };
        }

        // =====================================================
        // META DE CONSUMO MENSAL
        // =====================================================

        function obterDadosMeta(dash) {

            // Limite definido pelo usuário.
            // Não utiliza o consumo acumulado como meta.
            const limite = numero(
                dash.metaConsumoMensalLimiteKwh ??
                dash.metaGastoKwh
            );

            // Consumo acumulado durante o mês.
            const consumoMensal = numero(
                dash.metaConsumoMensalAtualKwh
            );

            // Somente o percentual varia com o consumo.
            const percentual = limite > 0
                ? consumoMensal / limite * 100
                : 0;

            return {
                limite,
                consumoMensal,
                percentual
            };
        }

        // =====================================================
        // STATUS DA META
        // =====================================================

        function atualizarStatusMeta(dash) {

            const card = document.getElementById("cardStatusMeta");
            const titulo = document.getElementById("textoStatusMeta");
            const descricao = document.getElementById("descricaoStatusMeta");
            const icone = document.getElementById("iconeStatusMeta");

            if (!card || !titulo || !descricao || !icone) return;

            const { limite, percentual } = obterDadosMeta(dash);

            card.classList.remove(
                "status-verde",
                "status-laranja",
                "status-vermelho",
                "status-sem-meta"
            );

            if (limite <= 0) {

                card.classList.add("status-sem-meta");

                titulo.textContent = "Nenhuma meta definida";
                descricao.textContent = "Configure uma meta para acompanhar seu consumo";

                icone.textContent = "flag";

            } else if (percentual >= 100) {

                card.classList.add("status-vermelho");

                titulo.textContent = dash.mensagemStatusMeta || "Meta mensal atingida!";
                descricao.textContent = "Você ultrapassou o limite de consumo definido";

                icone.textContent = "warning";

            } else if (percentual >= 80) {

                card.classList.add("status-laranja");

                titulo.textContent = dash.mensagemStatusMeta || "Atenção: meta próxima do limite";
                descricao.textContent = "Você já utilizou boa parte da sua meta mensal";

                icone.textContent = "priority_high";

            } else {

                card.classList.add("status-verde");

                titulo.textContent = dash.mensagemStatusMeta || "Você está dentro da sua meta!";
                descricao.textContent = "Seu consumo está dentro do limite mensal";

                icone.textContent = "flag";
            }
        }

        // =====================================================
        // ATUALIZAÇÃO DOS INDICADORES
        // =====================================================

        function atualizarInterface(dash) {

            if (!dash) return;

            const consumoDiario = numero(dash.consumoTotalDiarioKwh);

            const {
                limite,
                consumoMensal,
                percentual
            } = obterDadosMeta(dash);

            const elConsumo = document.getElementById("cardConsumoTotalDiario");
            const elCusto = document.getElementById("cardCustoDiario");
            const elMeta = document.getElementById("cardMetaGasto");
            const elPercentual = document.getElementById("cardPercentualMeta");
            const elConta = document.getElementById("cardValorContaEstimado");

            if (elConsumo) {
                elConsumo.textContent = formatarNumero(consumoDiario);
            }

            if (elCusto) {
                elCusto.textContent = formatarReais(consumoDiario * 0.85)
                    .replace("R$", "")
                    .trim();
            }

            if (elMeta) {
                elMeta.textContent = limite > 0
                    ? formatarNumero(limite)
                    : "--";
            }

            if (elPercentual) {
                elPercentual.textContent =
                    `${formatarNumero(percentual)}% da meta atingida`;
            }

            const meses = Array.isArray(dash.valorContaEstimadoReais)
                ? dash.valorContaEstimadoReais
                : [];

            const estimativaAtual = meses.length
                ? numero(meses[meses.length - 1].valor)
                : null;

            if (elConta && estimativaAtual !== null) {
                elConta.textContent = formatarReais(estimativaAtual)
                    .replace("R$", "")
                    .trim();
            }

            const consumoAtualTexto = document.getElementById("consumoAtualTexto");
            const consumoMensalTexto = document.getElementById("consumoMensal");
            const limiteMeta = document.getElementById("limiteMeta");
            const valorMeta = document.getElementById("valorMeta");
            const progresso = document.getElementById("progressoMeta");

            if (consumoAtualTexto) {
                consumoAtualTexto.textContent = formatarKwh(consumoDiario);
            }

            if (consumoMensalTexto) {
                consumoMensalTexto.textContent = formatarKwh(consumoMensal);
            }

            if (limiteMeta) {
                limiteMeta.textContent = limite > 0
                    ? `Meta: ${formatarKwh(limite)}`
                    : "Meta não definida";
            }

            if (valorMeta) {
                valorMeta.textContent = limite > 0
                    ? formatarKwh(limite)
                    : "-- kWh";
            }

            if (progresso) {

                const porcentagemBarra = limite > 0
                    ? Math.min(100, Math.max(0, percentual))
                    : 0;

                progresso.style.width = `${porcentagemBarra}%`;
                progresso.style.backgroundColor = obterCoresTema().linha;
            }

            atualizarStatusMeta(dash);
        }

        // =====================================================
        // JANELA FIXA DE 11 MINUTOS
        // =====================================================

        function obterJanelaDezMinutos() {

            const agora = new Date();

            agora.setSeconds(0, 0);

            const labels = [];

            // Últimos 10 minutos + minuto atual.
            for (let i = 10; i >= 0; i--) {

                const minuto = new Date(
                    agora.getTime() - i * 60 * 1000
                );

                const horaFormatada =
                    String(minuto.getHours()).padStart(2, "0") +
                    ":" +
                    String(minuto.getMinutes()).padStart(2, "0");

                labels.push(horaFormatada);
            }

            return labels;
        }

        // =====================================================
        // ORGANIZA OS DADOS POR MINUTO
        // =====================================================

        function obterPontosTempoReal(dash) {

            const pontos = Array.isArray(dash?.consumoTempoReal)
                ? dash.consumoTempoReal
                : [];

            const consumoPorMinuto = new Map();

            pontos.forEach(ponto => {

                const hora =
                    ponto.hora ||
                    ponto.horario ||
                    ponto.instante ||
                    "";

                if (!hora) return;

                consumoPorMinuto.set(
                    hora,
                    numero(ponto.consumoKwh)
                );
            });

            const labels = obterJanelaDezMinutos();

            return {

                labels,

                valores: labels.map(hora => {

                    if (!consumoPorMinuto.has(hora)) {
                        return null;
                    }

                    // Ajuste exclusivamente visual.
                    return consumoPorMinuto.get(hora) + AJUSTE_VISUAL_KWH;
                })
            };
        }

        // =====================================================
        // GRÁFICO DE CONSUMO EM TEMPO REAL
        // =====================================================

        function criarGraficoTempoReal(dash) {

            const canvas = document.getElementById("chartConsumoRealtime");

            if (!canvas) return;

            const cores = obterCoresTema();

            const pontos = obterPontosTempoReal(dash);

            const existente = Chart.getChart(canvas);

            if (existente) {
                existente.destroy();
            }

            chartRealtime = new Chart(canvas, {

                type: "line",

                data: {

                    labels: pontos.labels,

                    datasets: [{

                        label: "Consumo (kWh)",

                        data: pontos.valores,

                        borderColor: cores.linha,
                        backgroundColor: cores.preenchimento,

                        fill: true,
                        tension: 0.3,

                        spanGaps: false,

                        pointRadius: 3,
                        pointHoverRadius: 5,

                        pointBackgroundColor: cores.linha,

                        borderWidth: 2
                    }]
                },

                options: {

                    ...opcoesComuns(cores),

                    scales: {

                        y: {

                            beginAtZero: true,
                            grace: "15%",

                            grid: {
                                color: cores.grade
                            },

                            ticks: {

                                color: cores.texto,

                                callback: valor => numero(valor).toFixed(4)
                            }
                        },

                        x: {

                            grid: {
                                display: false
                            },

                            ticks: {

                                color: cores.texto,

                                // Não esconde nenhum horário.
                                autoSkip: false,

                                maxTicksLimit: 11,

                                maxRotation: 0,
                                minRotation: 0,

                                font: {
                                    size: 10
                                }
                            }
                        }
                    }
                }
            });

            const estado = document.getElementById("estadoConsumoRealtime");

            const temMedicao = pontos.valores.some(valor => valor !== null);

            if (estado) {
                estado.textContent = temMedicao
                    ? ""
                    : "Aguardando medições do dispositivo...";
            }
        }

        // =====================================================
        // ATUALIZAÇÃO DO GRÁFICO EM TEMPO REAL
        // =====================================================

        function atualizarGraficoTempoReal(dash) {

            if (!chartRealtime) {

                criarGraficoTempoReal(dash);

                return;
            }

            const cores = obterCoresTema();

            const pontos = obterPontosTempoReal(dash);

            // Atualiza os 11 horários conforme o relógio.
            chartRealtime.data.labels = pontos.labels;

            // Atualiza os valores correspondentes a cada minuto.
            chartRealtime.data.datasets[0].data = pontos.valores;

            chartRealtime.data.datasets[0].borderColor = cores.linha;

            chartRealtime.data.datasets[0].backgroundColor = cores.preenchimento;

            chartRealtime.data.datasets[0].pointBackgroundColor = cores.linha;

            chartRealtime.options.scales.y.grid.color = cores.grade;

            chartRealtime.options.scales.y.ticks.color = cores.texto;

            chartRealtime.options.scales.x.ticks.color = cores.texto;

            chartRealtime.update("none");

            const estado = document.getElementById("estadoConsumoRealtime");

            const temMedicao = pontos.valores.some(valor => valor !== null);

            if (estado) {
                estado.textContent = temMedicao
                    ? ""
                    : "Aguardando medições do dispositivo...";
            }
        }

        // =====================================================
        // GRÁFICO COMPARATIVO POR HORA
        // =====================================================

        function criarGraficoComparativo(dash) {

            const canvas = document.getElementById("chartResumoComparativo");

            if (!canvas) return;

            const cores = obterCoresTema();

            const pontos = Array.isArray(dash?.consumoDiarioHoras)
                ? dash.consumoDiarioHoras
                : [];

            const existente = Chart.getChart(canvas);

            if (existente) {
                existente.destroy();
            }

            chartComparativo = new Chart(canvas, {

                type: "bar",

                data: {

                    labels: pontos.map(p => p.hora || ""),

                    datasets: [{

                        label: "Energia consumida (kWh)",

                        data: pontos.map(p => numero(p.consumoKwh ?? p.valor)),

                        backgroundColor: cores.linha,

                        borderRadius: 5,

                        maxBarThickness: 36
                    }]
                },

                options: {

                    ...opcoesComuns(cores),

                    scales: {

                        y: {

                            beginAtZero: true,

                            grace: "15%",

                            grid: {
                                color: cores.grade
                            },

                            ticks: {
                                color: cores.texto,

                                callback: valor => numero(valor).toFixed(2).replace(".", ",")
                            }
                        },

                        x: {

                            grid: {
                                display: false
                            },

                            ticks: {
                                color: cores.texto,
                                maxRotation: 0
                            }
                        }
                    }
                }
            });

            const estado = document.getElementById("estadoConsumoDiario");

            if (estado) {
                estado.textContent = pontos.length
                    ? ""
                    : "Aguardando medições horárias...";
            }
        }

        // =====================================================
        // GRÁFICO DE ESTIMATIVA DA CONTA
        // =====================================================

        function criarGraficoValorConta(dash) {

            const canvas = document.getElementById("chartValorConta");

            if (!canvas) return;

            const cores = obterCoresTema();

            const pontos = Array.isArray(dash?.valorContaEstimadoReais)
                ? dash.valorContaEstimadoReais
                : [];

            const existente = Chart.getChart(canvas);

            if (existente) {
                existente.destroy();
            }

            chartValorConta = new Chart(canvas, {

                type: "bar",

                data: {

                    labels: pontos.map(p => p.mes || ""),

                    datasets: [{

                        label: "Valor estimado (R$)",

                        data: pontos.map(p => numero(p.valor)),

                        backgroundColor: cores.linha,

                        borderRadius: 5,

                        maxBarThickness: 42
                    }]
                },

                options: {

                    ...opcoesComuns(cores),

                    scales: {

                        y: {

                            beginAtZero: true,
                            grace: "12%",

                            grid: {
                                color: cores.grade
                            },

                            ticks: {

                                color: cores.texto,

                                callback: valor => formatarReais(valor)
                            }
                        },

                        x: {

                            grid: {
                                display: false
                            },

                            ticks: {
                                color: cores.texto,
                                maxRotation: 0
                            }
                        }
                    }
                }
            });
        }

        // =====================================================
        // ATUALIZAÇÃO DOS OUTROS GRÁFICOS
        // =====================================================

        function atualizarGraficoComparativo(dash) {

            if (!chartComparativo) {

                criarGraficoComparativo(dash);

                return;
            }

            const cores = obterCoresTema();

            const pontos = Array.isArray(dash?.consumoDiarioHoras)
                ? dash.consumoDiarioHoras
                : [];

            chartComparativo.data.labels = pontos.map(p => p.hora || "");

            chartComparativo.data.datasets[0].data =
                pontos.map(p => numero(p.consumoKwh ?? p.valor));

            chartComparativo.data.datasets[0].backgroundColor = cores.linha;

            chartComparativo.options.scales.y.grid.color = cores.grade;

            chartComparativo.options.scales.y.ticks.color = cores.texto;

            chartComparativo.options.scales.x.ticks.color = cores.texto;

            chartComparativo.update("none");

            const estado = document.getElementById("estadoConsumoDiario");

            if (estado) {
                estado.textContent = pontos.length
                    ? ""
                    : "Aguardando medições horárias...";
            }
        }

        function atualizarGraficoValorConta(dash) {

            if (!chartValorConta) {

                criarGraficoValorConta(dash);

                return;
            }

            const cores = obterCoresTema();

            const pontos = Array.isArray(dash?.valorContaEstimadoReais)
                ? dash.valorContaEstimadoReais
                : [];

            chartValorConta.data.labels = pontos.map(p => p.mes || "");

            chartValorConta.data.datasets[0].data =
                pontos.map(p => numero(p.valor));

            chartValorConta.data.datasets[0].backgroundColor = cores.linha;

            chartValorConta.options.scales.y.grid.color = cores.grade;

            chartValorConta.options.scales.y.ticks.color = cores.texto;

            chartValorConta.options.scales.x.ticks.color = cores.texto;

            chartValorConta.update("none");
        }

        // =====================================================
        // APLICAÇÃO DOS DADOS
        // =====================================================

        function aplicarDados(dash) {

            if (!dash) return;

            atualizarInterface(dash);

            atualizarGraficoTempoReal(dash);

            atualizarGraficoComparativo(dash);

            atualizarGraficoValorConta(dash);
        }

        // =====================================================
        // CONSULTA À API
        // =====================================================

        async function buscarDadosAtualizados() {

            if (requisicaoEmAndamento) return;

            requisicaoEmAndamento = true;

            try {

                const resposta = await fetch(ENDPOINT_DADOS, {

                    method: "GET",

                    headers: {
                        "Accept": "application/json"
                    },

                    credentials: "same-origin",

                    cache: "no-store"
                });

                if (!resposta.ok) {

                    throw new Error(
                        `Falha ao consultar dashboard: HTTP ${resposta.status}`
                    );
                }

                const dash = await resposta.json();

                aplicarDados(dash);

            } catch (erro) {

                console.error("Erro ao atualizar o dashboard:", erro);

            } finally {

                requisicaoEmAndamento = false;
            }
        }

        // =====================================================
        // INICIALIZAÇÃO
        // =====================================================

        if (initialDash) {

            atualizarInterface(initialDash);

            criarGraficoTempoReal(initialDash);

            criarGraficoComparativo(initialDash);

            criarGraficoValorConta(initialDash);

        } else {

            buscarDadosAtualizados();
        }

        // Consulta os dados a cada 5 segundos.
        // Essa consulta é GET e não salva medições no banco.
        window.setInterval(
            buscarDadosAtualizados,
            INTERVALO_ATUALIZACAO
        );

        // Atualização quando o tema é alterado.
        document.addEventListener("zatts:tema", () => {

            buscarDadosAtualizados();
        });

    });

    /*]]>*/
</script>

</body>
</html>
