<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <title>Home</title>

    <link rel="stylesheet" th:href="@{/css/headerTelas.css}">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="stylesheet" th:href="@{/css/dashboards.css}">

    <th:block th:replace="~{fragments/headTema :: tema}"></th:block>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>

<body>

<div th:replace="~{fragments/headerTelas :: header}"></div>

<main class="container-dashboard">

    <!-- CABEÇALHO -->
    <section class="titulo-dashboard">
        <div>
            <h1>Dashboard</h1>
            <p>
                Acompanhe o consumo elétrico da sua residência
                de forma simples, inteligente e acessível.
            </p>
        </div>

        <div class="cardMeta status-sem-meta" id="cardStatusMeta">
            <span class="material-symbols-outlined bandeiraMeta" id="iconeStatusMeta">
                flag
            </span>

            <div class="textoMeta">
                <h2 id="textoStatusMeta">
                    Carregando a sua meta...
                </h2>

                <p id="descricaoStatusMeta">
                    Acompanhamento do consumo mensal
                </p>
            </div>
        </div>
    </section>

    <!-- CARDS DE RESUMO EXISTENTES -->
    <div th:replace="~{fragments/cards :: cardsResumo}"></div>

    <!-- GRÁFICOS -->
    <section class="dashboard-grid">

        <!-- CONSUMO EM TEMPO REAL (MINUTO A MINUTO) -->
        <div th:replace="~{fragments/dashboards/consumo :: consumo}"></div>

        <!-- CONSUMO DIÁRIO E META -->
        <div class="coluna-central">
            <div th:replace="~{fragments/dashboards/comparativo :: comparativo}"></div>
            <div th:replace="~{fragments/dashboards/metaConsumo :: meta}"></div>
        </div>

        <!-- VALOR DA CONTA (ESTIMATIVA) -->
        <div th:replace="~{fragments/dashboards/valorConta :: valor}"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script th:src="@{/js/script.js}"></script>

<!-- INTEGRAÇÃO COM BACKEND ZATTS -->
<script th:inline="javascript">
    /*<![CDATA[*/
    document.addEventListener("DOMContentLoaded", function () {
        const initialDash = /*[[${dash}]]*/ null;

        let chartRealtime = null;
        let chartComparativo = null;
        let chartValorConta = null;

        const TARIFA_KWH = 0.85;
        const STORAGE_KEY_15 = "zatts_realtime_15min_data";

        // RECUPERA CORES DO SEU SCRIPT.JS OU VARIÁVEL CSS DO TEMA SEM CAUSAR CRASH
        function getThemeColors() {
            try {
                if (typeof window.coresGrafico === 'function') {
                    return window.coresGrafico();
                } else if (typeof coresGrafico === 'function') {
                    return coresGrafico();
                }
            } catch (e) {}

            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--cor-destaque').trim() || '#FF8C00';
            return {
                linha: primaryColor,
                preenchimento: primaryColor + '33',
                texto: '#FFFFFF',
                grade: 'rgba(255, 255, 255, 0.08)'
            };
        }

        function carregarPontos15() {
            try {
                const salvo = localStorage.getItem(STORAGE_KEY_15);
                if (salvo) return JSON.parse(salvo);
            } catch (e) {}
            return [];
        }

        function salvarPontos15(pontos) {
            try {
                localStorage.setItem(STORAGE_KEY_15, JSON.stringify(pontos));
            } catch (e) {}
        }

        function processarNovosPontos(novosDados) {
            let pontos = carregarPontos15();

            if (novosDados && Array.isArray(novosDados)) {
                novosDados.forEach(item => {
                    if (item && item.hora) {
                        const idx = pontos.findIndex(p => p.hora === item.hora);
                        if (idx !== -1) {
                            pontos[idx].consumoKwh = item.consumoKwh;
                        } else {
                            pontos.push({ hora: item.hora, consumoKwh: item.consumoKwh });
                        }
                    }
                });
            }

            if (pontos.length > 15) {
                pontos = pontos.slice(pontos.length - 15);
            }

            salvarPontos15(pontos);
            return pontos;
        }

        // 1. ATUALIZA INTERFACE E CARDS DE RESUMO
        function atualizarInterface(dash) {
            if (!dash) return;

            const consumoDiaKwh = dash.consumoTotalDiarioKwh !== undefined
                ? dash.consumoTotalDiarioKwh
                : 0.0;

            const elConsumoAtual = document.getElementById("cardConsumoTotalDiario") || document.querySelector(".card-consumo-atual");
            const elCustoAtual = document.getElementById("cardCustoDiario") || document.querySelector(".card-custo-atual");
            const elMeta = document.getElementById("cardMetaGasto") || document.querySelector(".card-meta");
            const elConta = document.getElementById("cardValorContaEstimado") || document.querySelector(".card-conta");

            const casasDecimais = (consumoDiaKwh > 0 && consumoDiaKwh < 0.01) ? 4 : 2;

            if (elConsumoAtual) {
                elConsumoAtual.innerText = consumoDiaKwh.toLocaleString('pt-BR', { minimumFractionDigits: casasDecimais, maximumFractionDigits: casasDecimais });
            }

            if (elCustoAtual) {
                const custoRealtime = (consumoDiaKwh * TARIFA_KWH);
                elCustoAtual.innerText = custoRealtime.toLocaleString('pt-BR', { minimumFractionDigits: casasDecimais, maximumFractionDigits: casasDecimais });
            }

            if (elMeta) {
                elMeta.innerText = dash.metaGastoKwh !== undefined ? Math.round(dash.metaGastoKwh) : 250;
            }

            const acumuladoMes = dash.metaConsumoMensalAtualKwh || 0;
            if (elConta) {
                const estimativaConta = (acumuladoMes * TARIFA_KWH) + 12.50;
                elConta.innerText = estimativaConta.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            const elConsumoAtualTexto = document.getElementById("consumoAtualTexto");
            const elConsumoMensal = document.getElementById("consumoMensal");
            if (elConsumoAtualTexto) elConsumoAtualTexto.innerText = acumuladoMes.toFixed(2) + " kWh";
            if (elConsumoMensal) elConsumoMensal.innerText = acumuladoMes.toFixed(2) + " kWh";

            const barraMeta = document.getElementById("progressoMeta") || document.querySelector(".progresso-meta-bar");
            const limite = dash.metaGastoKwh || 250;
            if (barraMeta) {
                let perc = (limite > 0 ? (acumuladoMes / limite) * 100 : 0);
                if (acumuladoMes > 0 && perc < 2.0) perc = 2.0;
                barraMeta.style.width = Math.min(100, Math.max(0, perc)) + "%";
            }
        }

        // 2. GRÁFICO 1: TEMPO REAL
        function initChartRealtime(dash) {
            const cores = getThemeColors();
            const canvas = document.getElementById("chartConsumoRealtime");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const pontos = processarNovosPontos(dash ? dash.consumoTempoReal : null);

            chartRealtime = new Chart(canvas, {
                type: 'line',
                data: {
                    labels: pontos.map(p => p.hora),
                    datasets: [{
                        label: 'Consumo (kWh)',
                        data: pontos.map(p => p.consumoKwh),
                        borderColor: cores.linha,
                        backgroundColor: cores.preenchimento,
                        fill: true,
                        tension: 0,
                        pointRadius: 4,
                        pointBackgroundColor: cores.linha
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: { callback: function(val) { return val.toFixed(4); } }
                        },
                        x: {
                            grid: { display: false },
                            ticks: { autoSkip: false }
                        }
                    }
                }
            });
        }

        // 3. GRÁFICO 2: DIÁRIO POR HORA
        function initChartComparativo(dash) {
            const cores = getThemeColors();
            const canvas = document.getElementById("chartResumoComparativo");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            const listaHoras = (dash && dash.consumoDiarioHoras) ? dash.consumoDiarioHoras : [];

            chartComparativo = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: listaHoras.map(p => p.hora || ""),
                    datasets: [{
                        label: 'Consumo (kWh)',
                        data: listaHoras.map(p => p.consumoKwh || p.valor || 0),
                        backgroundColor: cores.linha,
                        borderRadius: 4,
                        maxBarThickness: 32
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.08)' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // 4. GRÁFICO 3: ESTIMATIVA DA CONTA (MÁXIMO R$ 300)
        function initChartValorConta(dash) {
            const cores = getThemeColors();
            const canvas = document.getElementById("chartValorConta");
            if (!canvas) return;

            const existing = Chart.getChart(canvas);
            if (existing) existing.destroy();

            let listaMeses = (dash && dash.valorContaEstimadoReais) ? dash.valorContaEstimadoReais : [];

            chartValorConta = new Chart(canvas, {
                type: 'bar',
                data: {
                    labels: listaMeses.map(p => p.mes),
                    datasets: [{
                        label: 'R$',
                        data: listaMeses.map(p => p.valor),
                        backgroundColor: cores.linha,
                        borderRadius: 4,
                        maxBarThickness: 36
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 300,
                            grid: { color: 'rgba(255,255,255,0.08)' },
                            ticks: { callback: function(value) { return 'R$ ' + value; } }
                        },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // 5. POLLING A CADA 5 SEGUNDOS (SINCRONIZA DADOS E TEMA AUTOMATICAMENTE)
        function buscarDadosAtualizados() {
            fetch('/api/v1/web/dashboard/dados')
                .then(res => res.json())
                .then(dash => {
                    atualizarInterface(dash);

                    const cores = getThemeColors();

                    if (chartRealtime) {
                        const pontosAtuais = processarNovosPontos(dash ? dash.consumoTempoReal : null);
                        chartRealtime.data.labels = pontosAtuais.map(p => p.hora);
                        chartRealtime.data.datasets[0].data = pontosAtuais.map(p => p.consumoKwh);

                        if (cores.linha) {
                            chartRealtime.data.datasets[0].borderColor = cores.linha;
                            chartRealtime.data.datasets[0].backgroundColor = cores.preenchimento;
                            chartRealtime.data.datasets[0].pointBackgroundColor = cores.linha;
                        }
                        chartRealtime.update('none');
                    }

                    if (chartComparativo && dash.consumoDiarioHoras) {
                        chartComparativo.data.labels = dash.consumoDiarioHoras.map(p => p.hora || "");
                        chartComparativo.data.datasets[0].data = dash.consumoDiarioHoras.map(p => p.consumoKwh || p.valor || 0);

                        if (cores.linha) {
                            chartComparativo.data.datasets[0].backgroundColor = cores.linha;
                        }
                        chartComparativo.update('none');
                    }

                    if (chartValorConta && dash.valorContaEstimadoReais) {
                        chartValorConta.data.labels = dash.valorContaEstimadoReais.map(p => p.mes);
                        chartValorConta.data.datasets[0].data = dash.valorContaEstimadoReais.map(p => p.valor);

                        if (cores.linha) {
                            chartValorConta.data.datasets[0].backgroundColor = cores.linha;
                        }
                        chartValorConta.update('none');
                    }
                })
                .catch(err => console.error("Erro na atualização:", err));
        }

        // CARGA INICIAL
        if (initialDash) {
            atualizarInterface(initialDash);
            initChartRealtime(initialDash);
            initChartComparativo(initialDash);
            initChartValorConta(initialDash);
        } else {
            buscarDadosAtualizados();
        }

        setInterval(buscarDadosAtualizados, 5000);
    });
    /*]]>*/
</script>

</body>
</html>
