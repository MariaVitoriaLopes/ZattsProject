spring.application.name=backend
server.port=8081

# Conexão direta com o MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/zatt_db

# Configurações MQTT (Ajuste o host, usuario e senha se usar credenciais no EMQX)
mqtt.broker.url=tcp://z600fcff.ala.us-east-1.emqxsl.com:1883
mqtt.topic=sensores/corrente/#
mqtt.client.id=spring-boot-backend-${random.uuid}
# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Arquivos estáticos
spring.web.resources.static-locations=classpath:/static/
