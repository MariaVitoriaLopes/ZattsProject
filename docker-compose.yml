services:
  zatt_mongo:
    image: mongo:latest
    container_name: zatt_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
      MONGO_INITDB_DATABASE: zatt_db
    volumes:
      - zatt_mongo_data:/data/db

volumes:
  zatt_mongo_data:
