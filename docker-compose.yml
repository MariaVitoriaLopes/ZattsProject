version: '3.8'

services:
  zatts_mongo:
    image: mongo:latest
    container_name: zatts_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zatts_db
    volumes:
      - zatts_mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  zatts_backend:
    build: .
    container_name: zatts_backend
    ports:
      - "8081:8081"
    depends_on:
      - zatts_mongo
    environment:
      SPRING_DATA_MONGODB_URI: "mongodb+srv://1234:6AdFhASiWB7ULiq2@clusterdsm.xxxx.mongodb.net/zatts_db?retryWrites=true&w=majority"
      SERVER_PORT: "8081"
      TZ: "America/Sao_Paulo"

volumes:
  zatts_mongo_data: