services:
  zatt_mongo:
    image: mongo:latest
    container_name: zatt_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: zatt_db
    volumes:
      - zatt_mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  zatt_mongo_data: